id: io.github.savantsavior.lettersfall
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
base-version: '4.7'
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all

modules:
  - name: lettersfall
    buildsystem: simple

    sources:
      - type: archive
        url: https://github.com/savantsavior/lettersfall/archive/refs/tags/v1.1.1.tar.gz
        sha256: 80eeacc563c082fc15d10005bf447e5cf8f07269f3cc3c8f4f0f0b8fd66aa57e

      - type: file
        url: https://github.com/savantsavior/lettersfall/releases/download/v1.1.1/LettersFall-Linux-R2a.pck
        sha256: 2e17228272d465b89d81d48e3a6872af8fabcc5bf75220dd76a344001fcab17d

    build-commands:
      - install -Dm644 LettersFall-Linux-R2a.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
